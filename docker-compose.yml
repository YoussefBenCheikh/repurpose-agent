services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      REPURPOSE_DATABASE_URL: postgresql://postgres:postgres@db:5432/repurpose
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repurpose
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
